/* ---------- modal, toast, copy ---------- */
const modal = document.getElementById('modal'), mbox = document.getElementById('mbox');
function openModal(html){ mbox.innerHTML=html; modal.classList.add('on'); const f=mbox.querySelector('input,textarea'); if(f) setTimeout(()=>f.focus(),50); }
function closeModal(){ modal.classList.remove('on'); }
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }
function copy(text, what){
  const fallback = ()=> openModal('<h3>Copy '+esc(what)+'</h3><p>Select all and copy (Ctrl/Cmd + C).</p><textarea readonly style="min-height:240px" class="mono" id="cpy">'+esc(text)+'</textarea><div class="acts"><button class="btn" data-act="close">Done</button></div>');
  try{ navigator.clipboard.writeText(text).then(()=>toast('Copied '+what), fallback); }catch(e){ fallback(); }
  setTimeout(()=>{ const c=document.getElementById('cpy'); if(c) c.select(); },80);
}
function exportJSON(pretty){ return JSON.stringify({tool:'hr-service-intake', version:1, meta:S.meta, a:S.a}, null, pretty?2:0); }
function fileBase(){
  const slug = String(V('service_name')||'').trim().replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'HR-Service';
  const d = new Date(), p2 = n=>String(n).padStart(2,'0');
  return slug+'_'+d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
}
function download(text, suffix, mime){
  const name = fileBase()+suffix;
  try{
    const url = URL.createObjectURL(new Blob([text], {type:mime+';charset=utf-8'}));
    const a = document.createElement('a'); a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('Downloaded '+name);
  }catch(e){ copy(text, name); }
}
/* Load an answer file from pasted or uploaded text. Throws if it can't be read. */
function importText(txt){
  txt = String(txt||'').trim(); const m = txt.match(/\{[\s\S]*\}/);
  const r = mergeIn(JSON.parse(m?m[0]:txt));
  save(); closeModal(); renderAll();
  toast('Loaded '+r.added+' answer(s) from '+r.by+(r.conf?', '+r.conf+' to compare':''));
  if(r.conf){ cur='review'; renderNav(); renderMain(); }
}
const upfile = document.getElementById('upfile');
upfile.addEventListener('change', ()=>{
  const f = upfile.files && upfile.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ try{ importText(rd.result); }catch(err){ openModal('<h3>Couldn\'t load that file</h3><p>“'+esc(f.name)+'” doesn\'t look like an answer file from this tool. Ask the sender to download it again with <b>Download answer file</b>.</p><div class="acts"><button class="btn primary" data-act="close">OK</button></div>'); } upfile.value=''; };
  rd.onerror = ()=>{ toast('Couldn\'t read that file'); upfile.value=''; };
  rd.readAsText(f);
});

/* ---------- events ---------- */
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.q && (t.tagName==='TEXTAREA' || t.type==='text')){
    const a=A(t.dataset.q); a.v=t.value; a.by=S.meta.by||a.by; if(t.dataset.max){ const c=document.querySelector('[data-counter="'+t.dataset.q+'"]'); if(c){ c.textContent=t.value.length+' / '+t.dataset.max; c.classList.toggle('over',t.value.length>+t.dataset.max);} }
    save(); refreshMeta(t.dataset.q); if(t.dataset.q==='service_name') renderTop();
  } else if(t.dataset.flagnote){ A(t.dataset.flagnote).fnote=t.value; save(); }
  else if(t.dataset.rq && t.tagName!=='SELECT'){
    const a=A(t.dataset.rq); a.v=a.v||[]; a.v[+t.dataset.ri][t.dataset.rf]=t.value; a.by=S.meta.by||a.by; save(); refreshMeta(t.dataset.rq);
    const hd = t.closest('.row').querySelector('.rowhead b'); const r=a.v[+t.dataset.ri]; hd.textContent=(+t.dataset.ri+1)+'. '+(r.label||r.name||r.who||r.cond||'New entry');
  }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.q && (t.type==='radio' || t.tagName==='SELECT')){
    const a=A(t.dataset.q); a.v=t.value; a.by=S.meta.by||a.by; a.ok = true; save();
    const y=window.scrollY; renderNav(); renderTop(); renderMain(); window.scrollTo(0,y);
  } else if(t.dataset.rq && t.tagName==='SELECT'){
    const a=A(t.dataset.rq); a.v[+t.dataset.ri][t.dataset.rf]=t.value; save(); const y=window.scrollY; renderMain(); refreshMeta(t.dataset.rq); window.scrollTo(0,y);
  }
});
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.role){ role=b.dataset.role; renderAll(); return; }
  if(b.dataset.go){ cur=b.dataset.go; if(cur!=='preview'&&cur!=='review') lastSec=cur; renderNav(); renderMain(); window.scrollTo({top:0}); return; }
  if(b.dataset.jump){ const q=ALLQ[b.dataset.jump]; cur=lastSec=q.sec; role='all'; renderAll(); setTimeout(()=>{ const el=document.getElementById('q_'+q.id); if(el) el.scrollIntoView({block:'center'}); },30); return; }
  if(b.dataset.segv!==undefined && b.dataset.rq){ const a=A(b.dataset.rq); const r=a.v[+b.dataset.ri]; r[b.dataset.rf] = r[b.dataset.rf]===b.dataset.segv?'':b.dataset.segv; save(); const y=window.scrollY; renderMain(); refreshMeta(b.dataset.rq); window.scrollTo(0,y); return; }
  const act = b.dataset.act, id = b.dataset.id, y = window.scrollY;
  const rerender = ()=>{ renderNav(); renderTop(); renderMain(); window.scrollTo(0,y); };
  switch(act){
    case 'accept': A(id).ok=true; A(id).by=S.meta.by||A(id).by; save(); refreshMeta(id); break;
    case 'defer': { const a=A(id); a.defer=!a.defer; if(a.defer) a.flag=false; a.by=S.meta.by||a.by; save(); rerender(); break; }
    case 'flag': { const a=A(id); a.flag=!a.flag; if(a.flag) a.defer=false; save(); rerender(); if(a.flag){ const f=document.querySelector('[data-flagnote="'+id+'"]'); if(f) f.focus({preventScroll:true}); } break; }
    case 'add': { const a=A(id); a.v=Array.isArray(a.v)?a.v:[]; a.v.push({}); save(); rerender(); break; }
    case 'del': { const a=A(id); a.v.splice(+b.dataset.i,1); save(); rerender(); break; }
    case 'up': { const a=A(id), i=+b.dataset.i; [a.v[i-1],a.v[i]]=[a.v[i],a.v[i-1]]; save(); rerender(); break; }
    case 'menu': openModal('<h3>Save &amp; share</h3><p>Answers are saved automatically in this browser only. To get them to someone else, copy the answer file into an email or chat, or download it and attach the file.</p>'+
      '<div class="acts" style="justify-content:flex-start"><button class="btn primary" data-act="copy-json">Copy answer file</button><button class="btn" data-act="dl-json">Download answer file</button><button class="btn" data-act="import">Paste answers</button><button class="btn" data-act="upload">Upload answer file</button><button class="btn" data-act="who">'+(S.meta.by?'Change name':'Add your name')+'</button><button class="btn" data-act="gorev">Review &amp; send</button></div><div class="acts"><button class="btn ghost" data-act="close">Close</button></div>'); break;
    case 'gorev': closeModal(); cur='review'; renderNav(); renderMain(); window.scrollTo({top:0}); break;
    case 'who': openModal('<h3>Your name</h3><p>Your name is shown next to the answers you give, so the development team knows who to ask.</p><input type="text" id="whoin" value="'+esc(S.meta.by)+'" placeholder="e.g. Jordan Smith"><div class="acts"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="whosave">Save</button></div>'); break;
    case 'whosave': S.meta.by=document.getElementById('whoin').value.trim(); save(); closeModal(); renderAll(); break;
    case 'import': openModal('<h3>Load answers</h3><p>Paste an answer file someone sent you. It fills in anything you haven\'t answered yet. Where you both answered differently, you\'ll see both answers side by side on the Review page.</p><textarea id="impin" class="mono" style="min-height:160px" placeholder=\'{"tool":"hr-service-intake", …}\'></textarea><div id="imperr"></div><div class="acts" style="justify-content:space-between"><button class="btn" data-act="upload">Upload a file instead</button><span style="display:flex;gap:8px"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="impgo">Load</button></span></div>'); break;
    case 'upload': upfile.click(); break;
    case 'dl-json': download(exportJSON(true),'_answers.json','application/json'); break;
    case 'dl-csv': download(buildCSV(),'_workbook.csv','text/csv'); break;
    case 'dl-stories': download(buildStories(true),'_stories.md','text/markdown'); break;
    case 'dl-summary': download(buildSummary(),'_summary.txt','text/plain'); break;
    case 'dev': dev=!dev; try{ localStorage.setItem(KEY+'.dev', dev?'1':'0'); }catch(e){} renderAll(); window.scrollTo(0,y); toast(dev?'Developer view on':'Developer view off'); break;
    case 'fab': if(cur==='preview'){ cur=lastSec||'basics'; } else { if(cur!=='review') lastSec=cur; cur='preview'; } renderNav(); renderMain(); window.scrollTo({top:0}); break;
    case 'pvsubmit': toast('Preview only. Nothing was submitted.'); break;
    case 'pvjump': { const el=document.getElementById(b.dataset.to); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); break; }
    case 'impgo': try{ importText(document.getElementById('impin').value); }catch(err){ document.getElementById('imperr').innerHTML='<div class="note warn">Couldn\'t read that. Make sure you pasted the whole answer file.</div>'; } break;
    case 'sample': S = sample(); save(); renderAll(); toast('Loaded the Hybrid Work example'); break;
    case 'reset': openModal('<h3>Start a new service?</h3><p>This clears every answer in this browser. Download your answer file first if you need it.</p><div class="acts"><button class="btn" data-act="close">Cancel</button><button class="btn" data-act="dl-json">Download answer file</button><button class="btn primary" style="background:var(--flag);border-color:var(--flag)" data-act="resetgo">Clear everything</button></div>'); break;
    case 'resetgo': S=blank(); save(); closeModal(); cur='basics'; role='all'; renderAll(); window.scrollTo({top:0}); break;
    case 'close': closeModal(); break;
    case 'copy-json': copy(exportJSON(),'answer file'); break;
    case 'copy-open': copy(buildOpen(),'open items'); break;
    case 'copy-summary': copy(buildSummary(),'summary'); break;
    case 'copy-tsv': copy(buildTSV(),'workbook rows'); break;
    case 'copy-stories': copy(buildStories(),'stories'); break;
    case 'show-stories': document.getElementById('storybox').innerHTML='<pre class="out">'+esc(buildStories())+'</pre>'; break;
    case 'keep': S.conflicts.splice(+b.dataset.i,1); save(); rerender(); break;
    case 'take': { const c=S.conflicts[+b.dataset.i]; S.a[c.id]={v:c.theirs, ok:true, by:c.theirsBy}; S.conflicts.splice(+b.dataset.i,1); save(); rerender(); break; }
    case 'cflag': { const c=S.conflicts[+b.dataset.i]; const a=A(c.id); a.flag=true; a.fnote='Two answers: "'+fmt(ALLQ[c.id],c.mine)+'" vs "'+fmt(ALLQ[c.id],c.theirs)+'" ('+(c.theirsBy||'other')+')'; S.conflicts.splice(+b.dataset.i,1); save(); rerender(); break; }
  }
});

renderAll();
